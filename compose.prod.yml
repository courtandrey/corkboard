services:
  db:
    image: postgis/postgis:16-3.4-alpine
    command: postgres -c work_mem=32MB
    environment:
      POSTGRES_DB: corkboard
      POSTGRES_USER: corkboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corkboard}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corkboard -d corkboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata-prod:/var/lib/postgresql/data

  api:
    build:
      context: .
      network: host
      args:
        MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
        DEFAULT_CENTER: ${DEFAULT_CENTER:--73.9857,40.7484}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/corkboard
      SPRING_DATASOURCE_USERNAME: corkboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-corkboard}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      REPORT_AUTO_HIDE_THRESHOLD: ${REPORT_AUTO_HIDE_THRESHOLD:-5}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_FORCE: ${SEED_FORCE:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata-prod:
