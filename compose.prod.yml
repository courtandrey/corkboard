name: corkboard-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    command: postgres -c work_mem=32MB
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: corkboard
      POSTGRES_USER: corkboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corkboard -d corkboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata-prod:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
      network: host
      args:
        MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
        DEFAULT_CENTER: ${DEFAULT_CENTER:--73.9857,40.7484}
    restart: unless-stopped
    logging: *logging
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/corkboard
      SPRING_DATASOURCE_USERNAME: corkboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FORWARD_HEADERS_STRATEGY: framework
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env, e.g. https://board.example.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      REPORT_AUTO_HIDE_THRESHOLD: ${REPORT_AUTO_HIDE_THRESHOLD:-5}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_FORCE: ${SEED_FORCE:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    expose:
      - "9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  notifier:
    build:
      context: ./notifier
      network: host
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFIER_DATASOURCE_URL: jdbc:postgresql://db:5432/notifier
      NOTIFIER_DATASOURCE_USERNAME: corkboard
      NOTIFIER_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NOTIFIER_RATE_PER_SECOND: ${NOTIFIER_RATE_PER_SECOND:-10}
      NOTIFIER_RATE_BURST: ${NOTIFIER_RATE_BURST:-0}
      NOTIFIER_SEND_CONCURRENCY: ${NOTIFIER_SEND_CONCURRENCY:-8}
      NOTIFIER_KAFKA_CONCURRENCY: ${NOTIFIER_KAFKA_CONCURRENCY:-2}
      NOTIFIER_KAFKA_MAX_POLL: ${NOTIFIER_KAFKA_MAX_POLL:-50}
      JAVA_TOOL_OPTIONS: ${NOTIFIER_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=25}
      NOTIFIER_API_KEY: ${NOTIFIER_API_KEY:?set NOTIFIER_API_KEY in .env}
      NOTIFIER_TRANSPORT: ${NOTIFIER_TRANSPORT:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Lamppostal}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. board.example.com}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata-prod:
  kafka-data:
  caddy-data:
  caddy-config:
