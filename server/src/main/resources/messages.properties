feature.is_personal_scope_enabled.label=Personal boards
feature.is_personal_scope_enabled.description=Gives every resident a private board of their own, switched to from the topbar. With this off the switcher disappears and personal notes are unreachable — nothing is deleted.

feature.is_subscription_enabled.label=Shared personal boards
feature.is_subscription_enabled.description=Lets a resident show their personal board to people they are connected with, and adds the Subscriptions board where those notes are read. With this off nobody is let in and the shared boards are unreachable — nothing is deleted.

feature.are_user_details_editable.label=Editable account details
feature.are_user_details_editable.description=Lets residents change their own display name. With this off, names stay as they are and the account form is read-only.
