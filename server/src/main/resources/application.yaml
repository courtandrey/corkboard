spring:
  application:
    name: corkboard
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/corkboard}
    username: ${SPRING_DATASOURCE_USERNAME:corkboard}
    password: ${SPRING_DATASOURCE_PASSWORD:corkboard}

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080

corkboard:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  report-auto-hide-threshold: ${REPORT_AUTO_HIDE_THRESHOLD:5}
  google-client-id: ${GOOGLE_CLIENT_ID:}
