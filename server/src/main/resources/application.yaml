spring:
  application:
    name: corkboard
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/corkboard}
    username: ${SPRING_DATASOURCE_USERNAME:corkboard}
    password: ${SPRING_DATASOURCE_PASSWORD:corkboard}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000

springdoc:
  api-docs:
    path: /api/v1/openapi.json
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

corkboard:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  report-auto-hide-threshold: ${REPORT_AUTO_HIDE_THRESHOLD:5}
  cookie-secure: ${COOKIE_SECURE:false}
  session-ttl-days: ${SESSION_TTL_DAYS:30}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  google-callback-url: ${GOOGLE_CALLBACK_URL:http://localhost:8080/api/v1/auth/google/callback}
  auth-rate:
    per-ip: 5
    per-email: 5
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    topic: ${NOTIFICATIONS_TOPIC:corkboard.emails.v1}
  seed-demo-password: ${SEED_DEMO_PASSWORD:}
  seed-force: ${SEED_FORCE:false}
