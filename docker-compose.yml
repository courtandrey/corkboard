services:
  db:
    image: postgis/postgis:16-3.4-alpine
    command: postgres -c work_mem=32MB
    environment:
      POSTGRES_DB: corkboard
      POSTGRES_USER: corkboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corkboard}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corkboard -d corkboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    command: ./gradlew --no-daemon --project-cache-dir /root/.gradle/project-cache bootRun
    environment:
      GRADLE_BUILD_DIR: /root/.gradle/corkboard-build
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/corkboard
      SPRING_DATASOURCE_USERNAME: corkboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-corkboard}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      REPORT_AUTO_HIDE_THRESHOLD: ${REPORT_AUTO_HIDE_THRESHOLD:-5}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_FORCE: ${SEED_FORCE:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
    volumes:
      - ./server:/app
      - gradle-cache:/root/.gradle
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    environment:
      API_PROXY_TARGET: http://api:8080
      MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      DEFAULT_CENTER: ${DEFAULT_CENTER:--73.9857,40.7484}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  notifier:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    command: ./gradlew --no-daemon --project-cache-dir /root/.gradle/project-cache bootRun
    environment:
      GRADLE_BUILD_DIR: /root/.gradle/corkboard-notifier-build
      NOTIFIER_API_KEY: ${NOTIFIER_API_KEY:-dev-notifier-key}
      NOTIFIER_TRANSPORT: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_FROM: ${MAIL_FROM:-board@lamppostal.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Lamppostal}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFIER_RATE_PER_SECOND: ${NOTIFIER_RATE_PER_SECOND:-10}
      NOTIFIER_SEND_CONCURRENCY: ${NOTIFIER_SEND_CONCURRENCY:-8}
    volumes:
      - ./notifier:/app
      - notifier-gradle-cache:/root/.gradle
    ports:
      - "${NOTIFIER_PORT:-8082}:8080"
    depends_on:
      mailpit:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  dbdata:
  gradle-cache:
  kafka-data:
  notifier-gradle-cache:
  web-node-modules:
